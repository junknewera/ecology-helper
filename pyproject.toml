[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-helper"
version = "0.1.0"
description = "Minimal configuration for the mental-helper project."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Oleg" }]
dependencies = [
    "fastparquet>=2024.11.0",
    "ipykernel>=7.1.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "sentence-transformers>=3.0.0",
    "llama-cpp-python>=0.3.16",
    "huggingface-hub>=0.36.0",
    "streamlit>=1.51.0",
]
